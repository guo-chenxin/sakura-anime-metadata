name: probe-paging

# 诊断 bgm.tv/anime/browser 的翻页行为。
#
# 现象：collect.py 在第 11 页判定「无条目」后停止，只枚举到 240 个 id
# （应该是 999 页 ≈ 2.4 万部）。需要定位是限速、还是排序参数、还是深页有上限。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install httpx

      - name: 诊断翻页
        run: python probe_paging.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe_ids/
          git diff --staged --quiet || git commit -m "probe-paging: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
