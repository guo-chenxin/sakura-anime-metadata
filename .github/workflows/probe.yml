name: probe

# 探测 Bangumi API 的真实返回结构。
#
# 为什么放在 Actions 里跑：本地网络无法访问 api.bgm.tv
# （IP 层封锁，DoH 拿到真实 IP 也会被 Reset），
# 而 GitHub Actions 的 runner 在海外，可直连。
#
# 跑完在 Actions 页面下载 artifact，或直接从 api.github.com 拉。

on:
  workflow_dispatch:   # 只手动触发，避免无谓消耗

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install httpx

      - name: 运行探测
        run: python probe.py

      - name: 上传探测结果
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe/
          retention-days: 7

      # 同时把结果提交到仓库，方便直接看
      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/
          git diff --staged --quiet || git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
