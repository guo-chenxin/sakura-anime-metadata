name: collect

# Bangumi 元数据采集。
#
# 采集策略：按季度切片调用 API 搜索（air_date 过滤），
# 绕过「total 钳制 1000」和「页码折叠」两个限制（详见 collect.py 顶部注释）。
#
# 分片并行说明
# ------------
# 每个分片产出独立文件（subjects_s0of8.jsonl.gz 等），互不覆盖。
# 分片之间**不直接 push 到同一分支**（会冲突），而是：
#   1. 先上传 artifact（每片独立）
#   2. 由 merge 步骤所在 job（shard 0）在所有分片跑完后统一提交
#
# 实测数据（2026-11，365 部样本）：
#   番名中文 86% / 简介含中文 76% / infobox 100% / 标签 96%
#   集标题（name_cn or name）老番 33%、现代番 59%
#
# 典型用法：
#   验证一片： shard=0 shards=8 year_from=1980 year_to=2026 limit=0
#   全量：     开 8 个 job，shard=0..7，shards=8

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '最多采多少部（0=不限）'
        required: false
        default: '0'
      year_from:
        description: '起始年份'
        required: false
        default: '1980'
      year_to:
        description: '结束年份'
        required: false
        default: '2026'
      shard:
        description: '分片号（0 起）'
        required: false
        default: '0'
      shards:
        description: '总分片数（1=不分片）'
        required: false
        default: '1'
      with_relations:
        description: '同时采关联作品（额外 1 请求/部）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub 单 job 上限 6 小时

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install httpx

      - name: 采集
        env:
          LIMIT: ${{ inputs.limit }}
          YEAR_FROM: ${{ inputs.year_from }}
          YEAR_TO: ${{ inputs.year_to }}
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          WITH_REL: ${{ inputs.with_relations }}
        run: |
          LIMIT="${LIMIT:-0}"
          YEAR_FROM="${YEAR_FROM:-1980}"
          YEAR_TO="${YEAR_TO:-2026}"
          SHARD="${SHARD:-0}"
          SHARDS="${SHARDS:-1}"

          ARGS="--limit $LIMIT --year-from $YEAR_FROM --year-to $YEAR_TO"
          if [ "$SHARDS" != "1" ]; then
            ARGS="$ARGS --shard $SHARD --shards $SHARDS"
          fi
          if [ "$WITH_REL" = "true" ]; then
            ARGS="$ARGS --with-relations"
          fi

          echo "采集参数: $ARGS"
          python collect.py $ARGS

      # artifact 是分片之间的可靠交换方式：同名分片不会互相覆盖
      - name: 上传本片产出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangumi-shard-${{ inputs.shard }}
          path: data/
          retention-days: 30

      # 分片模式：不 push（避免并发冲突），等全部跑完后再汇总
      - name: 提交（仅 non-shard 或 shard 0）
        if: always() && (inputs.shards == '1' || inputs.shard == '0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --staged --quiet || \
            git commit -m "collect: y${YEAR_FROM}-${YEAR_TO} s${SHARD}/${SHARDS} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 并发场景下远端可能已更新，rebase 后重试
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then break; fi
            sleep 5
          done
