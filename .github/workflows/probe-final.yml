name: probe-final

# 最终确认按年/季度切片能否完整枚举全量。
#
# 已知：
# - API air_date 过滤真的生效（2024 首条是 2024-01-13）
# - limit=50 实际只返回 20 条，total 被钳制在 1000
#
# 需确认：每页真实条数、offset 真实上限、哪些年份需要按月切。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install httpx

      - name: 最终确认切片能力
        run: python probe_final.py

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: probe_ids/
          retention-days: 14

      - name: 提交结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe_ids/
          git diff --staged --quiet || git commit -m "probe-final: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
